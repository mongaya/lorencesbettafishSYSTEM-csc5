<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorence's Betta Fish POS System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

/* HEADER */
.header {
    background: #0f172a;
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #38bdf8;
}

.nav button {
    background: transparent;
    border: none;
    color: white;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 7px;
}

.nav button:hover,
.nav button.active {
    background: #0ea5e9;
}

/* LOGIN */
.login-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #0ea5e9);
}

.login-box {
    background: white;
    width: 400px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
}

.login-box h1 {
    margin-bottom: 10px;
}

.input-group {
    margin: 15px 0;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.btn {
    padding: 11px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #0ea5e9;
    color: white;
}

.btn-danger {
    background: #ef4444;
    color: white;
}

.btn-success {
    background: #16a34a;
    color: white;
}

/* MAIN */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.hero {
    background: linear-gradient(120deg, #e0f2fe, #f0fdfa);
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 25px;
}

.hero h1 {
    margin-bottom: 10px;
}

/* PRODUCTS */
.search {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.search input {
    max-width: 500px;
}

.product-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 14px;
    padding: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.fish-image {
    height: 150px;
    background: linear-gradient(135deg, #cffafe, #dbeafe);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.product-card h3 {
    margin-bottom: 8px;
}

.price {
    font-size: 20px;
    color: #0284c7;
    font-weight: bold;
    margin: 10px 0;
}

.stock {
    font-size: 12px;
    color: #166534;
    background: #dcfce7;
    padding: 5px 8px;
    border-radius: 15px;
}

/* CART */
.cart-button {
    position: fixed;
    right: 25px;
    bottom: 25px;
    background: #0f172a;
    color: white;
    padding: 15px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* ADMIN DASHBOARD */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin: 20px 0;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

.stat-card h3 {
    color: #666;
    font-size: 14px;
}

.stat-card p {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;
}

/* TABLE */
.table-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f8fafc;
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-box {
    background: white;
    width: 450px;
    max-width: 90%;
    padding: 25px;
    border-radius: 15px;
}

/* RESPONSIVE */
@media(max-width: 800px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .header {
        flex-direction: column;
        gap: 15px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================
   PRODUCT DATA
========================= */

let products = [
    {
        id: 1,
        name: "Galaxy Koi Betta",
        price: 450,
        stock: 8,
        category: "Koi"
    },
    {
        id: 2,
        name: "Blue Rim Betta",
        price: 350,
        stock: 12,
        category: "Halfmoon"
    },
    {
        id: 3,
        name: "Red Samurai Betta",
        price: 500,
        stock: 5,
        category: "Samurai"
    },
    {
        id: 4,
        name: "Black Orchid Betta",
        price: 600,
        stock: 4,
        category: "Fancy"
    },
    {
        id: 5,
        name: "Candy Nemo Betta",
        price: 550,
        stock: 7,
        category: "Fancy"
    },
    {
        id: 6,
        name: "Platinum White Betta",
        price: 400,
        stock: 10,
        category: "Halfmoon"
    }
];

let orders = [];
let cart = [];
let currentRole = "";


/* =========================
   LOGIN
========================= */

function showLogin() {

    document.getElementById("app").innerHTML = `

    <div class="login-container">

        <div class="login-box">

            <h1>🐟 Lorence's Betta Fish</h1>

            <p>Point of Sale System</p>

            <br>

            <div class="input-group">
                <label>Username</label>
                <input id="username"
                       placeholder="Enter username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input id="password"
                       type="password"
                       placeholder="Enter password">
            </div>

            <div class="input-group">
                <label>Login As</label>

                <select id="role">

                    <option value="user">
                        Customer / User
                    </option>

                    <option value="admin">
                        Administrator
                    </option>

                </select>

            </div>

            <button
                class="btn btn-primary"
                style="width:100%"
                onclick="login()">

                Login

            </button>

            <br><br>

            <small>
                Admin Demo:<br>
                Username: <b>admin</b><br>
                Password: <b>admin123</b>
            </small>

        </div>

    </div>
    `;
}


function login() {

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;

    let role =
        document.getElementById("role").value;

    if (username === "" || password === "") {

        alert("Please enter username and password.");

        return;
    }

    if (role === "admin") {

        if (
            username !== "admin" ||
            password !== "admin123"
        ) {

            alert("Invalid admin account.");

            return;
        }

        currentRole = "admin";

        showAdmin();

    } else {

        currentRole = "user";

        showUser();
    }
}


/* =========================
   HEADER
========================= */

function header() {

    return `

    <div class="header">

        <div class="logo">
            🐟 Lorence's
            <span>Betta Fish</span>
        </div>

        <div class="nav">

            ${
                currentRole === "user"

                ?

                `
                <button onclick="showUser()">
                    Shop
                </button>

                <button onclick="showMyOrders()">
                    My Orders
                </button>
                `

                :

                `
                <button onclick="showAdmin()">
                    Dashboard
                </button>

                <button onclick="showOrders()">
                    Orders
                </button>

                <button onclick="showProducts()">
                    Products
                </button>

                <button onclick="showCustomers()">
                    Customers
                </button>
                `
            }

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>

    `;
}


/* =========================
   USER SHOP
========================= */

function showUser() {

    currentRole = "user";

    document.getElementById("app").innerHTML =
        header() +

        `

        <div class="container">

            <div class="hero">

                <h1>
                    Find Your Perfect Betta 🐟
                </h1>

                <p>
                    Browse our available betta fish
                    and place your order.
                </p>

            </div>

            <div class="search">

                <input
                    id="search"
                    placeholder="🔎 Search betta fish..."
                    onkeyup="searchProducts()">

                <select
                    onchange="filterCategory(this.value)">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Koi">
                        Koi
                    </option>

                    <option value="Halfmoon">
                        Halfmoon
                    </option>

                    <option value="Samurai">
                        Samurai
                    </option>

                    <option value="Fancy">
                        Fancy
                    </option>

                </select>

            </div>

            <div
                id="productGrid"
                class="product-grid">

                ${productCards(products)}

            </div>

        </div>

        ${
            cart.length > 0

            ?

            `
            <button
                class="cart-button"
                onclick="showCart()">

                🛒 Cart (${cart.length})
                -
                ₱${cartTotal()}

            </button>
            `

            :

            ""
        }

        `;
}


function productCards(list) {

    return list.map(product => `

        <div class="product-card">

            <div class="fish-image">
                🐠
            </div>

            <h3>
                ${product.name}
            </h3>

            <p>
                Category:
                ${product.category}
            </p>

            <p class="price">
                ₱${product.price}
            </p>

            <span class="stock">
                ${product.stock} available
            </span>

            <br><br>

            <button
                class="btn btn-primary"
                onclick="addToCart(${product.id})">

                Add to Cart

            </button>

        </div>

    `).join("");
}


/* =========================
   SEARCH
========================= */

function searchProducts() {

    let text =
        document.getElementById("search")
        .value
        .toLowerCase();

    let result = products.filter(p =>
        p.name.toLowerCase().includes(text)
    );

    document.getElementById("productGrid")
        .innerHTML = productCards(result);
}


function filterCategory(category) {

    if (category === "All") {

        document.getElementById("productGrid")
            .innerHTML = productCards(products);

        return;
    }

    let result =
        products.filter(
            p => p.category === category
        );

    document.getElementById("productGrid")
        .innerHTML = productCards(result);
}


/* =========================
   CART
========================= */

function addToCart(id) {

    let product =
        products.find(p => p.id === id);

    if (product.stock <= 0) {

        alert("Out of stock!");

        return;
    }

    cart.push(product);

    alert(product.name + " added to cart!");

    showUser();
}


function cartTotal() {

    return cart.reduce(
        (total, item) =>
            total + item.price,
        0
    );
}


function showCart() {

    document.getElementById("app")
        .insertAdjacentHTML(

        "beforeend",

        `

        <div class="modal">

            <div class="modal-box">

                <h2>
                    🛒 Shopping Cart
                </h2>

                <br>

                ${
                    cart.map((item, index) => `

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        margin:10px 0;
                    ">

                        <span>
                            ${item.name}
                        </span>

                        <b>
                            ₱${item.price}
                        </b>

                    </div>

                    `).join("")
                }

                <hr>

                <h3>
                    Total:
                    ₱${cartTotal()}
                </h3>

                <br>

                <button
                    class="btn btn-success"
                    onclick="checkout()">

                    Checkout

                </button>

                <button
                    class="btn"
                    onclick="this.closest('.modal').remove()">

                    Close

                </button>

            </div>

        </div>

        `
    );
}


/* =========================
   CHECKOUT
========================= */

function checkout() {

    let customer =
        prompt("Enter your name:");

    if (!customer) return;

    let address =
        prompt("Enter delivery address:");

    if (!address) return;

    let payment =
        prompt(
            "Payment Method:\n" +
            "1 - Cash on Delivery\n" +
            "2 - GCash\n" +
            "3 - Bank Transfer"
        );

    if (!payment) return;

    let paymentMethod =
        payment === "1"
        ? "Cash on Delivery"
        : payment === "2"
        ? "GCash"
        : "Bank Transfer";

    let order = {

        id:
            "ORD-" +
            Math.floor(
                Math.random() * 999999
            ),

        customer: customer,

        address: address,

        payment: paymentMethod,

        items: [...cart],

        total: cartTotal(),

        status: "Pending",

        date:
            new Date().toLocaleString()

    };

    /* Deduct stock */

    cart.forEach(item => {

        let product =
            products.find(
                p => p.id === item.id
            );

        product.stock--;

    });

    orders.push(order);

    cart = [];

    alert(
        "Order placed successfully!\n" +
        "Order ID: " + order.id
    );

    showMyOrders();
}


/* =========================
   MY ORDERS
========================= */

function showMyOrders() {

    currentRole = "user";

    document.getElementById("app").innerHTML =
        header() +

        `

        <div class="container">

            <h1>My Orders</h1>

            <br>

            ${
                orders.length === 0

                ?

                `
                <div class="table-box">
                    You don't have any orders yet.
                </div>
                `

                :

                orders.map(order => `

                    <div
                        class="table-box"
                        style="margin-bottom:20px">

                        <h3>
                            ${order.id}
                        </h3>

                        <p>
                            Date:
                            ${order.date}
                        </p>

                        <p>
                            Payment:
                            ${order.payment}
                        </p>

                        <p>
                            Status:
                            <b>${order.status}</b>
                        </p>

                        <br>

                        ${
                            order.items.map(
                                item => `

                                <p>
                                    ${item.name}
                                    -
                                    ₱${item.price}
                                </p>

                                `
                            ).join("")
                        }

                        <hr>

                        <h3>
                            Total:
                            ₱${order.total}
                        </h3>

                    </div>

                `).join("")
            }

        </div>

        `;
}


/* =========================
   ADMIN DASHBOARD
========================= */

function showAdmin() {

    currentRole = "admin";

    let totalSales =
        orders.reduce(
            (sum, order) =>
                sum + order.total,
            0
        );

    document.getElementById("app").innerHTML =
        header() +

        `

        <div class="container">

            <h1>
                Admin Dashboard
            </h1>

            <div class="stats">

                <div class="stat-card">
                    <h3>Total Sales</h3>
                    <p>₱${totalSales}</p>
                </div>

                <div class="stat-card">
                    <h3>Total Orders</h3>
                    <p>${orders.length}</p>
                </div>

                <div class="stat-card">
                    <h3>Total Products</h3>
                    <p>${products.length}</p>
                </div>

                <div class="stat-card">
                    <h3>Low Stock</h3>
                    <p>
                        ${
                            products.filter(
                                p => p.stock <= 5
                            ).length
                        }
                    </p>
                </div>

            </div>

            <div class="table-box">

                <h2>
                    Recent Orders
                </h2>

                <br>

                ${orderTable()}

            </div>

        </div>

        `;
}


/* =========================
   ADMIN ORDERS
========================= */

function showOrders() {

    document.getElementById("app").innerHTML =
        header() +

        `

        <div class="container">

            <h1>
                Order Management
            </h1>

            <br>

            <div class="table-box">

                ${orderTable()}

            </div>

        </div>

        `;
}


function orderTable() {

    if (orders.length === 0) {

        return `
            <p>No orders yet.</p>
        `;
    }

    return `

    <table>

        <thead>

            <tr>

                <th>Order ID</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody>

        ${
            orders.map(order => `

                <tr>

                    <td>
                        ${order.id}
                    </td>

                    <td>
                        ${order.customer}
                    </td>

                    <td>
                        ₱${order.total}
                    </td>

                    <td>
                        ${order.payment}
                    </td>

                    <td>
                        ${order.status}
                    </td>

                    <td>

                        <select
                            onchange="
                                updateOrderStatus(
                                    '${order.id}',
                                    this.value
                                )
                            ">

                            <option
                                ${
                                    order.status ===
                                    "Pending"
                                    ? "selected"
                                    : ""
                                }>
                                Pending
                            </option>

                            <option
                                ${
                                    order.status ===
                                    "Processing"
                                    ? "selected"
                                    : ""
                                }>
                                Processing
                            </option>

                            <option
                                ${
                                    order.status ===
                                    "Completed"
                                    ? "selected"
                                    : ""
                                }>
                                Completed
                            </option>

                            <option
                                ${
                                    order.status ===
                                    "Cancelled"
                                    ? "selected"
                                    : ""
                                }>
                                Cancelled
                            </option>

                        </select>

                    </td>

                </tr>

            `).join("")
        }

        </tbody>

    </table>

    `;
}


function updateOrderStatus(id, status) {

    let order =
        orders.find(
            o => o.id === id
        );

    order.status = status;

    alert(
        "Order status changed to " +
        status
    );

    showOrders();
}


/* =========================
   PRODUCT MANAGEMENT
========================= */

function showProducts() {

    document.getElementById("app").innerHTML =
        header() +

        `

        <div class="container">

            <h1>
                Product Management
            </h1>

            <br>

            <button
                class="btn btn-primary"
                onclick="addProduct()">

                + Add Product

            </button>

            <br><br>

            <div class="table-box">

                <table>

                    <thead>

                        <tr>

                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody>

                    ${
                        products.map(
                            product => `

                            <tr>

                                <td>
                                    ${product.name}
                                </td>

                                <td>
                                    ${product.category}
                                </td>

                                <td>
                                    ₱${product.price}
                                </td>

                                <td>
                                    ${product.stock}
                                </td>

                                <td>

                                    <button
                                        class="btn btn-danger"
                                        onclick="
                                            deleteProduct(
                                                ${product.id}
                                            )
                                        ">

                                        Delete

                                    </button>

                                </td>

                            </tr>

                            `
                        ).join("")
                    }

                    </tbody>

                </table>

            </div>

        </div>

        `;
}


function addProduct() {

    let name =
        prompt("Product name:");

    if (!name) return;

    let price =
        Number(
            prompt("Product price:")
        );

    let stock =
        Number(
            prompt("Product stock:")
        );

    let category =
        prompt("Product category:");

    products.push({

        id:
            Date.now(),

        name: name,

        price: price,

        stock: stock,

        category: category

    });

    alert("Product added!");

    showProducts();
}


function deleteProduct(id) {

    if (
        !confirm(
            "Delete this product?"
        )
    ) return;

    products =
        products.filter(
            p => p.id !== id
        );

    showProducts();
}


/* =========================
   CUSTOMERS
========================= */

function showCustomers() {

    let customers = [];

    orders.forEach(order => {

        if (
            !customers.includes(
                order.customer
            )
        ) {

            customers.push(
                order.customer
            );

        }

    });

    document.getElementById("app").innerHTML =
        header() +

        `

        <div class="container">

            <h1>
                Customer Management
            </h1>

            <br>

            <div class="table-box">

                <table>

                    <thead>

                        <tr>

                            <th>Customer</th>
                            <th>Total Orders</th>
                            <th>Total Spent</th>

                        </tr>

                    </thead>

                    <tbody>

                    ${
                        customers.map(
                            customer => {

                                let customerOrders =
                                    orders.filter(
                                        o =>
                                            o.customer ===
                                            customer
                                    );

                                let total =
                                    customerOrders
                                    .reduce(
                                        (sum,o) =>
                                            sum +
                                            o.total,
                                        0
                                    );

                                return `

                                <tr>

                                    <td>
                                        ${customer}
                                    </td>

                                    <td>
                                        ${customerOrders.length}
                                    </td>

                                    <td>
                                        ₱${total}
                                    </td>

                                </tr>

                                `;

                            }
                        ).join("")
                    }

                    </tbody>

                </table>

            </div>

        </div>

        `;
}


/* =========================
   LOGOUT
========================= */

function logout() {

    currentRole = "";
    cart = [];

    showLogin();
}


/* START SYSTEM */

showLogin();

</script>

</body>
</html>

name: Checkout pre-deploy tests
on:
  pull_request:
    paths:
      - 'lorencebetta/**'
      - 'tests/checkout_predeploy.test.cjs'
      - '.github/workflows/checkout-tests.yml'
  workflow_dispatch:
jobs:
  checkout-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find lorencebetta/api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check checkout JS syntax
        run: |
          node --check lorencebetta/checkout_pay_first.js
          node --check lorencebetta/checkout_shipping_ui.js
          node --check lorencebetta/admin_pay_first.js
      - name: Checkout regression contracts
        run: node tests/checkout_predeploy.test.cjs

name: Checkout pre-deploy tests
on:
  pull_request:
    paths:
      - 'lorencebetta/**'
      - 'tests/checkout_predeploy.test.cjs'
      - '.github/workflows/checkout-tests.yml'
  workflow_dispatch:
jobs:
  checkout-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find lorencebetta/api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check checkout JS syntax
        run: |
          node --check lorencebetta/checkout_pay_first.js
          node --check lorencebetta/checkout_shipping_ui.js
          node --check lorencebetta/admin_pay_first.js
      - name: Checkout regression contracts
        run: node tests/checkout_predeploy.test.cjs
  database-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lorence_betta_fish
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP MySQL extension and client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-mysql mysql-client
      - name: Create disposable database
        run: |
          mysql -h 127.0.0.1 -uroot -proot < lorencebetta/database.sql
          mysql -h 127.0.0.1 -uroot -proot < lorencebetta/upgrade.sql
          mysql -h 127.0.0.1 -uroot -proot < tests/checkout_integration.sql
      - name: Start isolated PHP API
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: lorence_betta_fish
        run: |
          php -S 127.0.0.1:8765 -t lorencebetta > /tmp/checkout-php.log 2>&1 &
          sleep 2
      - name: Test real order creation and admin verification
        run: node tests/checkout_integration.cjs
      - name: Show PHP errors on failure
        if: failure()
        run: tail -100 /tmp/checkout-php.log || true
